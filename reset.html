    color: var(--ink);
    font-family: "Montserrat", -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, rgba(11, 12, 14, 0.12), rgba(11, 12, 14, 0.55));
    z-index: -1;
  }
  main {
    width: 100%;
    max-width: 420px;
    padding: 32px 26px 28px;
    border-radius: 28px;
    background: linear-gradient(160deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.015));
    border: 1px solid rgba(255, 255, 255, 0.18);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.22);
  }
  .brand { display: flex; align-items: center; justify-content: center; margin-bottom: 18px; }
  .brand img { display: block; width: 150px; height: 150px; margin: -26px 0 -28px; }
  h1 { margin: 0 0 8px; font-size: 24px; line-height: 1.2; font-weight: 800; letter-spacing: -0.01em; text-wrap: balance; }
  p { margin: 0 0 20px; color: var(--ink2); font-size: 14px; line-height: 1.55; }
  .who { color: var(--ink); font-weight: 700; word-break: break-all; }
  label { display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; margin-bottom: 8px; color: var(--ink2); }
  .field { position: relative; margin-bottom: 8px; }
  input {
    width: 100%;
    height: 54px;
    padding: 0 54px 0 20px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.07);
    color: var(--ink);
    font: 600 16px "Montserrat", sans-serif;
    outline: none;
  }
  input:focus-visible { border-color: rgba(255, 255, 255, 0.55); }
  .eye {
    position: absolute; right: 8px; top: 7px;
    width: 40px; height: 40px; border: 0; border-radius: 50%;
    background: transparent; color: var(--ink2); cursor: pointer;
    display: grid; place-items: center;
  }
  .eye:focus-visible { outline: 2px solid var(--ink); }
  .hint { font-size: 12px; color: var(--ink2); margin: 0 0 22px 6px; min-height: 18px; }
  .hint.bad { color: var(--bad); }
  button.main {
    width: 100%; height: 56px; border: 0; border-radius: 999px;
    background: var(--acc); color: var(--onacc);
    font: 700 15px "Montserrat", sans-serif; letter-spacing: 0.02em;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 8px 0 26px; cursor: pointer;
  }
  button.main[disabled] { opacity: 0.55; cursor: default; }
  button.main .go {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--onacc); color: var(--acc);
    display: grid; place-items: center;
  }
  button.main:focus-visible, a.main:focus-visible { outline: 3px solid rgba(255, 255, 255, 0.7); outline-offset: 3px; }
  a.main {
    text-decoration: none;
    width: 100%; height: 56px; border-radius: 999px;
    background: var(--acc); color: var(--onacc);
    font: 700 15px "Montserrat", sans-serif;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 8px 0 26px;
  }
  a.main .go { width: 40px; height: 40px; border-radius: 50%; background: var(--onacc); color: var(--acc); display: grid; place-items: center; }
  .badge {
    width: 56px; height: 56px; border-radius: 50%;
    display: grid; place-items: center; margin-bottom: 18px;
    background: rgba(111, 227, 154, 0.14); color: var(--ok);
  }
  .badge.bad { background: rgba(255, 107, 114, 0.14); color: var(--bad); }
  .spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--ink); animation: s 0.8s linear infinite; margin: 8px 0 18px; }
  @keyframes s { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  [hidden] { display: none !important; }
</style>

document.documentElement.lang = lang;

const $ = (id) => document.getElementById(id);
const show = (id) => { for (const s of ["loading", "form", "done", "bad"]) $(s).hidden = s !== id; };

$("t-loading").textContent = t.loading;
$("t-title").textContent = t.title;
$("t-for").textContent = t.for;
$("t-label").textContent = t.label;
$("t-label2").textContent = t.label2;
$("t-save").textContent = t.save;
$("t-open").textContent = t.open;
$("eye").setAttribute("aria-label", t.show);
$("b-title").textContent = t.badTitle;
$("b-text").textContent = t.badText;

const bad = () => show("bad");
const mode = q.get("mode");
const code = q.get("oobCode");

$("eye").addEventListener("click", () => {
  const showing = $("pwd").type === "text";
  $("pwd").type = showing ? "password" : "text";
  $("pwd2").type = showing ? "password" : "text";
  $("eye").setAttribute("aria-pressed", String(!showing));
});

async function run() {
  if (!code) return bad();
  try {
    if (mode === "resetPassword") {
      const email = await verifyPasswordResetCode(auth, code);
      $("who").textContent = email;
      show("form");
      $("pwd").focus();
      const save = async () => {
        const pwd = $("pwd").value;
        const hint = $("hint");
        hint.className = "hint";
        if (pwd.length < 6) { hint.textContent = t.short; hint.className = "hint bad"; $("pwd").focus(); return; }
        if (pwd !== $("pwd2").value) { hint.textContent = t.mismatch; hint.className = "hint bad"; $("pwd2").focus(); return; }
        $("save").disabled = true;
        try {
          await confirmPasswordReset(auth, code, pwd);
          $("d-title").textContent = t.doneTitle;
          $("d-text").textContent = t.doneText;
          show("done");
        } catch (e) {
          $("save").disabled = false;
          const c = String(e && e.code || "");
          if (c.includes("weak-password")) hint.textContent = t.weak;
          else if (c.includes("network")) hint.textContent = t.net;
          else return bad();
          hint.className = "hint bad";
        }
      };
      $("save").addEventListener("click", save);
      $("pwd").addEventListener("keydown", (e) => { if (e.key === "Enter") $("pwd2").focus(); });
      $("pwd2").addEventListener("keydown", (e) => { if (e.key === "Enter") save(); });
    } else if (mode === "verifyEmail") {
      await applyActionCode(auth, code);
      $("d-title").textContent = t.verTitle;
      $("d-text").textContent = t.verText;
      show("done");
    } else {
      bad();
    }
  } catch (e) {
    bad();
  }
}
run();
</script>
</body>
</html>
